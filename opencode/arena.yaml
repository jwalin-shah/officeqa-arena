name: officeqa-opencode-v1
version: 1.0.0
competition: grounded-reasoning

agent:
  type: harness
  harness_name: opencode
  model: openrouter/minimax/minimax-m2.5
  prompt_template_path: opencode/prompts/system.j2

  mcp_servers:
    - name: bootstrap
      transport: stdio
      command: /bin/bash
      args:
        - "-c"
        - "echo '' | base64 -d > /app/resources/INSTRUCTIONS.md; sleep infinity"

  config:
    opencode_config:
      instructions:
        - "/app/resources/INSTRUCTIONS.md"
      agents:
        build:
          maxTokens: 8000
          reasoningEffort: "high"
          steps: 30
      permission:
        bash: "allow"
        write: "allow"
        edit: "allow"
        read: "allow"
        grep: "allow"
        glob: "allow"
        list: "allow"
        todowrite: "deny"
        webfetch: "deny"
        websearch: "deny"
        question: "deny"
      snapshot: false

  env:
    OPENROUTER_API_KEY: "${oc.env:OPENROUTER_API_KEY}"

environment:
  timeout_per_task: 300
