name: "officeqa-nomcp"
version: "3.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "prompts/system.j2"

  mcp_servers:
    - name: officeqa
      transport: stdio
      command: python3
      args: ["/installed-agent/mcp_server.py"]

  config:
    max_turns: 10
    temperature: 0.0
    reasoning_effort: "high"

  env:
    OPENROUTER_API_KEY: "REDACTED"
    LLM_API_KEY: "REDACTED"

environment:
  timeout_per_task: 300
