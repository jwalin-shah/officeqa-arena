# Goose + nomcp MCP tools — use nomcp/prompts (not repo-root prompts/system.j2).

name: "officeqa-nomcp"
version: "3.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "nomcp/prompts/system.j2"

  mcp_servers:
    - name: officeqa
      transport: stdio
      command: python3
      args: ["/installed-agent/mcp_server.py"]

  config:
    max_turns: 10

  env:
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"

environment:
  timeout_per_task: 300
