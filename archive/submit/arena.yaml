# Submission v7: OpenHands SDK + reasoning_effort low (high was default, causing same hallucination as goose).
# Also: stdio MCP only, max_iterations 20, oracle prompt.
# Note: reasoning_effort is REAL for OpenHands (unlike goose where it's ignored).
# Prompt: prompts/system.j2 — full MCP tool workflow.

name: "officeqa-submit"
version: "7.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "openhands-sdk"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "prompts/system.j2"

  mcp_servers:
    - name: officeqa-arena
      transport: stdio
      command: /installed-agent/run_mcp.sh

  config:
    reasoning_effort: "low"
    temperature: 0.0
    max_iterations: 20

  env:
    LLM_API_KEY: "REDACTED"
    OPENROUTER_API_KEY: "REDACTED"
    OFFICEQA_SQLITE_DB: ""
    OPENHANDS_SUPPRESS_BANNER: "1"
    TELEMETRY_SOURCE: "openhands"
    PYTHONPATH: "/installed-agent/overrides"

environment:
  timeout_per_task: 300
