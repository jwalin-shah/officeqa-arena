# Arena harness config: OpenHands SDK + MiniMax M2.5 via OpenRouter.
#
# Uses OpenHands SDK harness with MCP server for structured data access.
# MCP server parses Treasury Bulletin files and exposes search/compute tools.

name: "officeqa-openhands"
version: "1.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "openhands-sdk"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "openhands/prompts/system.j2"

  mcp_servers:
    - name: officeqa
      transport: stdio
      command: /installed-agent/run_mcp.sh

  config:
    temperature: 0.0
    max_iterations: 12

  env:
    LLM_API_KEY: "${OPENROUTER_API_KEY}"
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    OPENHANDS_SUPPRESS_BANNER: "1"
    PYTHONPATH: "/installed-agent/overrides"

environment:
  timeout_per_task: 300
