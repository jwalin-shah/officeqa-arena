# v7: Inline CPI (proven), proper SKILL.md format, computation patterns, max_turns=10.
# Skills use correct goose format: subdirectory/SKILL.md + YAML frontmatter.
# Summon extension auto-discovers skills and MiniMax calls load() when needed.

name: "officeqa-v7"
version: "7.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "submit-goose/prompts/system.j2"

  skills_dir: "submit-goose/skills"

  config:
    max_turns: 10
    temperature: 0.0

  env:
    OPENROUTER_API_KEY: "REDACTED"

environment:
  timeout_per_task: 300
