[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "officeqa-mcp"
version = "1.0.3"
description = "OfficeQA MCP Server - Treasury Bulletin analysis tools"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
officeqa-mcp = "officeqa_mcp.server:main"

[tool.setuptools]
packages = ["officeqa_mcp"]
package-dir = {"officeqa_mcp" = "src/officeqa_mcp"}
