# Arena harness config: OpenCode + MiniMax M2.5 via OpenRouter.
#
# Final eval uses MiniMax M2.5 (confirmed by Arena team).
# OpenCode gives model grep/bash/read/python + MCP tools via stdio.
# Score = correct_tasks × (1.0 + cost_adj + time_adj). Max 282.9.

name: "officeqa-arena"
version: "0.7.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "opencode"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "prompts/system.j2"
  skills_dir: "skills/"

  mcp_servers:
    - name: officeqa-arena
      transport: stdio
      command: /opt/officeqa/run_mcp.sh

  config:
    temperature: 0.0
    max_iterations: 15
    load_skills: true
    # reasoning_effort: "medium"  # removed in v0.7.1 — let model think as hard as it needs

  env:
    LLM_API_KEY: "${OPENROUTER_API_KEY}"
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    OFFICEQA_SQLITE_DB: "/app/corpus/officeqa_corpus.sqlite3"

environment:
  timeout_per_task: 600
