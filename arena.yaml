# v12: Minimal prompt + MCP + tools.py dropped into /app/resources/
name: officeqa-v12
version: 12.0.0
competition: grounded-reasoning

agent:
  type: harness
  harness_name: goose
  model: openrouter/minimax/minimax-m2.5
  prompt_template_path: prompts/system_v12.j2

  config:
    max_turns: 10

  mcp_servers:
    - type: stdio
      name: tools
      cmd: bash
      args:
        - "-c"
        - "echo '' | base64 -d > /app/resources/tools.py && echo '' | base64 -d > /app/resources/README.txt && echo '' | base64 -d > /tmp/_mcp.py && exec python3 /tmp/_mcp.py"

  env:
    OPENROUTER_API_KEY: REDACTED

environment:
  timeout_per_task: 300
