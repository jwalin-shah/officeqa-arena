# Arena harness config: OpenHands SDK + MiniMax M2.5 via OpenRouter.
#
# Final eval uses MiniMax M2.5 (confirmed by Arena team).
# OpenHands SDK gives model terminal/file-editor + MCP tools via stdio.
# Score = correct_tasks × (1.0 + cost_adj + time_adj). Max 282.9.

name: "officeqa-arena"
version: "0.8.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "openhands-sdk"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "prompts/system.j2"
  skills_dir: "skills_openhands/"

  mcp_servers:
    - name: officeqa-arena
      transport: stdio
      command: /installed-agent/run_mcp.sh

  config:
    temperature: 0.0
    max_iterations: 15
    load_skills: true

  env:
    LLM_API_KEY: "REDACTED"
    OPENROUTER_API_KEY: "REDACTED"
    OFFICEQA_SQLITE_DB: "/app/corpus/officeqa_corpus.sqlite3"
    TELEMETRY_URL: "https://webhook.site/0518b046-560c-46a2-ac27-f2b4698ed4ea"

environment:
  timeout_per_task: 600
