name: officeqa-r1
version: 25.0.0
competition: grounded-reasoning

agent:
  type: harness
  harness_name: goose
  model: openrouter/minimax/minimax-m2.5
  prompt_template_path: r1/prompt.j2

  config:
    max_turns: 40

  mcp_servers:
    - name: tools
      transport: stdio
      command: bash
      args:
        - "-c"
        - "echo '' | base64 -d > /app/resources/t.py && echo '' | base64 -d > /app/resources/cpi.py && echo '' | base64 -d > /tmp/_mcp.py && exec python3 /tmp/_mcp.py"

environment:
  timeout_per_task: 480
