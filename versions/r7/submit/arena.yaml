name: officeqa-r7
version: 20.1.0
competition: grounded-reasoning

agent:
  type: harness
  harness_name: goose
  model: openrouter/minimax/minimax-m2.5
  prompt_template_path: r7/submit/prompt.j2

  skills_dir: r7/skills

  mcp_servers:
    - name: setup
      transport: stdio
      command: bash
      args:
        - "-c"
        - "echo '' | base64 -d > /app/resources/q.py && mkdir -p /root/.config/goose/skills/verify && echo '' | base64 -d > /root/.config/goose/skills/verify/SKILL.md && cd /app/resources && python3 q.py preview > /dev/null 2>&1 && exec cat"

  config:
    max_turns: 40

environment:
  timeout_per_task: 480
