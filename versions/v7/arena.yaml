# v7: Inline CPI (proven), proper SKILL.md format, computation patterns.
# Skills use correct goose format: subdirectory + SKILL.md + frontmatter.

name: "officeqa-v7"
version: "7.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "prompts/system.j2"
  skills_dir: "skills/"

  config:
    max_turns: 10
    temperature: 0.0

  env:
    OPENROUTER_API_KEY: "REDACTED"

environment:
  timeout_per_task: 300
