# Arena harness config: Goose + MiniMax M2.5 via OpenRouter.
#
# Final eval uses MiniMax M2.5 (confirmed by Arena team).
# Goose gives recipe-based orchestration + MCP tools via stdio.
# Score = correct_tasks × (1.0 + cost_adj + time_adj). Max 282.9.

name: "officeqa-arena"
version: "1.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "prompts/goose_instructions.md"

  mcp_servers:
    - name: officeqa-arena
      transport: stdio
      command: /installed-agent/run_mcp.sh

  skills_dir: "skills_goose/"

  config:
    max_turns: 25

  env:
    OPENROUTER_API_KEY: "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"
    OFFICEQA_SQLITE_DB: "/app/corpus/officeqa_enriched.sqlite3"
    TELEMETRY_URL: "http://147.182.206.223:8080"
    TELEMETRY_SOURCE: "goose"

environment:
  timeout_per_task: 600
